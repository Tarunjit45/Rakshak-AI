<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Detection Logs</title>
</head>
<body>
    <h1>Threat Detection Logs</h1>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Timestamp (UTC)</th>
                <th>Threat Type</th>
                <th>Description</th>
                <th>Latitude</th>
                <th>Longitude</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log[0] }}</td>
                <td>{{ log[1] }}</td>
                <td>{{ log[2] }}</td>
                <td>{{ log[3] if log[3] else 'N/A' }}</td>
                <td>{{ log[4] if log[4] else 'N/A' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{{ url_for('index') }}">Back to Live Feed</a></p>
</body>
</html>
